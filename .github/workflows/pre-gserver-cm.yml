name: CM rotation unit tests
on:
  push:
    branches: ['feat/pre-gserver-private-bot-core']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test artifacts/bot/tests/cmRotation.test.mjs artifacts/bot/tests/privateAdmission.test.mjs
