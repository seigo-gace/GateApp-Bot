# TGtumbler policy docs → Cloudflare Pages (wrangler) from GitHub Actions.
#
# Secrets (repository):
#   CLOUDFLARE_API_TOKEN — required for deploy
#   CLOUDFLARE_ACCOUNT_ID — optional (wrangler uses env if needed)
# Variables (optional):
#   CLOUDFLARE_PAGES_PROJECT_NAME — default tgtumbler-docs
#
# hentaigay.org: Custom domain only after Master approves public (Privacy gate). Preview on *.pages.dev.
name: tgtumbler-pages

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/tgtumbler-pages/**'
      - '.github/workflows/tgtumbler-pages.yml'
  pull_request:
    paths:
      - 'docs/tgtumbler-pages/**'
      - '.github/workflows/tgtumbler-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: docs/tgtumbler-pages
        run: npm ci

      - name: Build static site
        working-directory: docs/tgtumbler-pages
        run: npm run build

      - name: Verify output
        working-directory: docs/tgtumbler-pages
        run: test -f dist/index.html && test -f dist/guidelines.html && test -f dist/createvdobot-terms.html

      - name: Deploy to Cloudflare Pages (production branches only)
        if: github.event_name != 'pull_request'
        working-directory: docs/tgtumbler-pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            :
          else
            echo "Skip deploy: not production ref (${GITHUB_REF})"
            exit 0
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Skip deploy: CLOUDFLARE_API_TOKEN secret not set"
            exit 0
          fi
          PROJECT_NAME="${CLOUDFLARE_PAGES_PROJECT_NAME:-tgtumbler-docs}"
          PROD_BRANCH="${GITHUB_REF_NAME:-master}"
          if ! npx wrangler pages project list 2>/dev/null | grep -Fq "$PROJECT_NAME"; then
            echo "Creating Pages project: $PROJECT_NAME (production branch: $PROD_BRANCH)"
            npx wrangler pages project create "$PROJECT_NAME" --production-branch="$PROD_BRANCH"
          fi
          npx wrangler pages deploy dist --project-name="$PROJECT_NAME" --commit-dirty=true

      - name: Verify published CreateVdobot terms (production only)
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          PROJECT_NAME="${CLOUDFLARE_PAGES_PROJECT_NAME:-tgtumbler-docs}"
          URL="https://${PROJECT_NAME}.pages.dev/createvdobot-terms.html"
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 35 "$URL" -o /tmp/createvdobot-terms-live.html
          grep -Fq 'CreateVdobot' /tmp/createvdobot-terms-live.html
          grep -Fq '投稿者' /tmp/createvdobot-terms-live.html
          printf 'CREATOR_TERMS_LIVE_GET=PASS; PUBLIC_URL=%s\\n' "$URL"

