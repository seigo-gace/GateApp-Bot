# TGtumbler policy docs → Cloudflare Pages (wrangler) from GitHub Actions.
#
# Secrets (repository):
#   CLOUDFLARE_API_TOKEN — required for deploy
#   CLOUDFLARE_ACCOUNT_ID — optional (wrangler uses env if needed)
# Variables (optional):
#   CLOUDFLARE_PAGES_PROJECT_NAME — default tgtumbler-docs
#
# hentaigay.org: Custom domain only after Master approves public (Privacy gate). Preview on *.pages.dev.
name: tgtumbler-pages

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/tgtumbler-pages/**'
      - '.github/workflows/tgtumbler-pages.yml'
  pull_request:
    paths:
      - 'docs/tgtumbler-pages/**'
      - '.github/workflows/tgtumbler-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: docs/tgtumbler-pages
        run: npm ci

      - name: Build static site
        working-directory: docs/tgtumbler-pages
        run: npm run build

      - name: Verify output
        working-directory: docs/tgtumbler-pages
        run: test -f dist/index.html && test -f dist/guidelines.html

      - name: Deploy to Cloudflare Pages (production branches only)
        if: github.event_name != 'pull_request'
        working-directory: docs/tgtumbler-pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            :
          else
            echo "Skip deploy: not production ref (${GITHUB_REF})"
            exit 0
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Skip deploy: CLOUDFLARE_API_TOKEN secret not set"
            exit 0
          fi
          PROJECT_NAME="${CLOUDFLARE_PAGES_PROJECT_NAME:-tgtumbler-docs}"
          npx wrangler pages deploy dist --project-name="$PROJECT_NAME"
