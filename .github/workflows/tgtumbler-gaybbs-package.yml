name: TGtumbler GayBBS Docker package verification
on:
  pull_request:
    paths:
      - 'artifacts/bot/**'
      - 'lib/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/tgtumbler-gaybbs-package.yml'
  push:
    branches: ['chat/tgtumbler-gserver-deploy-20261106']
jobs:
  gaybbs-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated GayBBS image (no credentials)
        run: docker build --file artifacts/bot/deploy/Dockerfile.gaybbs --tag gaybbs:ci --pull=false .
      - name: Check bundled program without Telegram, DB, or network
        run: docker run --rm --network none --entrypoint node gaybbs:ci --check /app/gaybbs.mjs
      - name: Export verified token-free GayBBS bundle for offline Gserver update
        run: |
          mkdir -p /tmp/gaybbs-ci-bundle
          container=$(docker create gaybbs:ci)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/app/gaybbs.mjs" /tmp/gaybbs-ci-bundle/gaybbs.mjs
          node --check /tmp/gaybbs-ci-bundle/gaybbs.mjs
          sha256sum /tmp/gaybbs-ci-bundle/gaybbs.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gaybbs-profile-bundle
          path: /tmp/gaybbs-ci-bundle/gaybbs.mjs
          if-no-files-found: error
          retention-days: 2
