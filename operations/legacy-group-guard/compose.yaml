services:
  legacy-group-guard:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      GUARD_STATE_FILE: /state/state.json
    volumes:
      - ./state:/state
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
